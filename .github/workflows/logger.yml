# 서울시 실시간 도착정보 자동 기록 (노트북 없이 GitHub 서버에서 실행)
# 기록 시간대(한국 시간): 매일 06:40~22:50 연속 · 지하철 60초, 버스 75초 간격
# GitHub 예약 실행은 몇 시간씩 늦게 시작하기도 해서, 매시간 실행을 걸어 두고 한 번에 하나씩만 돌린다.
#  - 돌고 있는 실행이 있으면 다음 실행은 대기했다가 앞 실행이 끝나자마자 이어서 시작 → 빈 구간 최소화
#  - 각 실행은 시간대가 끝나거나 5시간 40분이 지나면 저장(커밋)하고 종료
#  - 실행이 끝났는데 아직 시간대 안이면 다음 실행을 바로 이어서 건다(GitHub가 예약 실행을 자주 건너뛰어서)
#  - LAST_DAY 이후에는 아무것도 하지 않음
name: 실시간 기록
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "52 20 * * *"     # 05:52 KST — 아침 시작을 놓치지 않게 여러 번
    - cron: "7 21 * * *"
    - cron: "27 21 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "몇 분 기록할까요 (비우면 예약 방식으로 시간대 끝까지)"
        default: ""
permissions:
  contents: write
  actions: write
concurrency:
  group: logger
  cancel-in-progress: false
env:
  LAST_DAY: "2026-11-29"
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: 기간 확인
        id: gate
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          TODAY=$(TZ=Asia/Seoul date +%F)
          if [[ "$TODAY" > "$LAST_DAY" ]]; then echo "run=no" >> "$GITHUB_OUTPUT"; echo "기록 기간 끝($LAST_DAY)"; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
      - name: 기록
        if: steps.gate.outputs.run == 'yes'
        env:
          SEOUL_SUBWAY_KEY: ${{ secrets.SEOUL_SUBWAY_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TZ: Asia/Seoul
          PYTHONIOENCODING: utf-8
        run: |
          git pull --rebase -q || true
          if [ -n "${{ github.event.inputs.minutes }}" ]; then
            python logger.py --config config.example.json --now ${{ github.event.inputs.minutes }}
          else
            python logger.py --config config.example.json --scheduled 340
          fi
      - name: 로그 저장(커밋)
        if: always() && steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "logger-bot"
          git config user.email "logger-bot@users.noreply.github.com"
          find logs -name '*.jsonl' -exec gzip -f -9 {} \;
          git add -A logs || true
          git diff --cached --quiet && exit 0
          git commit -m "기록 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 7; done
      - name: 다음 실행 이어 걸기
        if: always() && steps.gate.outputs.run == 'yes' && github.event.inputs.minutes == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HM=$(TZ=Asia/Seoul date +%H%M)
          RAN=$(( $(date +%s) - ${{ steps.gate.outputs.start }} ))
          if [ "$RAN" -lt 1800 ]; then echo "이번 실행이 30분도 안 돼서 이어 걸지 않음"; exit 0; fi
          if [ "$HM" -ge 0630 ] && [ "$HM" -lt 2235 ]; then
            gh workflow run logger.yml -R "${{ github.repository }}" --ref main && echo "다음 실행 요청"
          fi
